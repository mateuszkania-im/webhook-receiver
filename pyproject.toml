[project]
name = "webhook-receiver"
version = "0.1.0"
description = "Durable, idempotent webhook receiver on FastAPI and SQLite"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.16.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RET", "RUF", "ASYNC", "PT", "S", "N", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["webhook_receiver", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ASYNC109", "ASYNC110", "S101", "S106", "S311"]
"scripts/**" = ["S311"]
"src/webhook_receiver/app.py" = ["S311"]
"src/webhook_receiver/store/*" = ["S608"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not slow'"
markers = ["slow: wall-clock timing checks, run with -m slow"]

[tool.coverage.run]
source = ["webhook_receiver"]

[tool.coverage.report]
exclude_also = ["^\\s*\\.\\.\\.$", "if TYPE_CHECKING:"]
